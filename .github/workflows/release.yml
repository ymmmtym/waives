name: release

# Every push to main builds and tests the plugins, then publishes the bundles as
# a GitHub Release. The tag is v<VERSION>-<sha>: VERSION comes from the built
# revision, and the short SHA keeps one release per commit, so re-running a
# workflow updates that release instead of creating another one.
#
# Bump VERSION in the same pull request when you want a new version number.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and test only, do not publish a release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - MyFirstMasteringEQ
          - MyFirstTapeMachine
        platform: [linux, macos]
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
            extra_cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'

    uses: ./.github/workflows/_build-plugin.yml
    with:
      plugin: ${{ matrix.plugin }}
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      extra_cmake_args: ${{ matrix.extra_cmake_args }}
      # The bundles are handed to the publish job in the same run.
      retention_days: 1

  publish:
    name: publish release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    steps:
      # Needed for VERSION. checkout defaults to the triggering commit, which is
      # also what the archives were built from.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="$(cat VERSION)"
          tag="v${version}-${GITHUB_SHA::7}"
          echo "Publishing ${tag}"

          # Re-running a workflow must not fail on an existing tag.
          if gh release view "${tag}" > /dev/null 2>&1; then
            gh release upload "${tag}" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            # --target pins the tag to the commit the archives were built from:
            # main may have moved on while the build was running.
            gh release create "${tag}" dist/*.tar.gz dist/SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "Waives ${version} (${GITHUB_SHA::7})" \
              --generate-notes
          fi

          echo "### Release [${tag}](https://github.com/${GH_REPO}/releases/tag/${tag})" >> "$GITHUB_STEP_SUMMARY"
