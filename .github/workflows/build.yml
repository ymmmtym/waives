name: build

# CI for pull requests. Pushes to main are covered by release.yml, which builds
# with the same reusable workflow and then publishes a GitHub Release.
#
# Add a plugin to matrix.plugin once it appears in WAIVES_PLUGINS in the root
# CMakeLists.txt.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # A plugin row is multiplied by every platform row. The platform axis
        # has to live in the matrix itself: an include-only entry would
        # overwrite the single base combination instead of adding one.
        plugin: [MyFirstMasteringEQ]
        platform: [linux, macos]
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
            # Universal AU so it runs natively on both Apple silicon and Intel.
            extra_cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'

    uses: ./.github/workflows/_build-plugin.yml
    with:
      plugin: ${{ matrix.plugin }}
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      extra_cmake_args: ${{ matrix.extra_cmake_args }}
