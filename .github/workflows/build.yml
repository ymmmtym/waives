name: build

# Linux: VST3 + CLAP + Standalone.  macOS: the same plus AU (.component).
# Every job uploads its bundles as a downloadable artifact.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            extra_cmake_args: ''
          - name: macos
            os: macos-latest
            # Universal AU so it runs natively on both Apple silicon and Intel.
            extra_cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libegl-dev libcurl4-openssl-dev

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: fetchcontent-juce-9.0.6-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra_cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate AU
        if: runner.os == 'macOS'
        run: |
          set -x
          component="$HOME/Library/Audio/Plug-Ins/Components/MyFirstMasteringEQ.component"
          mkdir -p "$(dirname "$component")"
          rm -rf "$component"
          cp -R build/MyFirstMasteringEQ_artefacts/Release/AU/MyFirstMasteringEQ.component \
                "$(dirname "$component")/"

          # arm64 macOS refuses to load unsigned code, and the audio component
          # registry only picks the bundle up after it is restarted.
          codesign --force --deep -s - "$component"
          xattr -dr com.apple.quarantine "$component" || true
          killall -9 AudioComponentRegistrar || true
          sleep 3

          auval -a 2>&1 | grep -i mfmq || echo "component not listed by auval -a"

          for attempt in 1 2 3; do
            if auval -v aufx Mfmq Myau; then
              exit 0
            fi
            echo "auval attempt $attempt failed, restarting the registrar"
            killall -9 AudioComponentRegistrar || true
            sleep 5
          done
          exit 1

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstMasteringEQ-${{ matrix.name }}
          path: build/MyFirstMasteringEQ_artefacts/Release/
          if-no-files-found: error
          retention-days: 14
