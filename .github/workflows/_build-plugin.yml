name: build-plugin

# Reusable build of one plugin on one platform. Called by build.yml (pull
# requests) and release.yml (main), so the recipe exists once.

on:
  workflow_call:
    inputs:
      plugin:
        description: Directory name under plugins/
        type: string
        required: true
      platform:
        description: linux or macos
        type: string
        required: true
      os:
        description: Runner image
        type: string
        required: true
      extra_cmake_args:
        description: Extra arguments for the configure step
        type: string
        required: false
        default: ''
      retention_days:
        description: How long the artifact is kept
        type: number
        required: false
        default: 14

jobs:
  build:
    name: ${{ inputs.plugin }} / ${{ inputs.platform }}
    runs-on: ${{ inputs.os }}
    # A universal macOS build takes 12-13 minutes warm. One run was cut off at
    # exactly 15 minutes and marked cancelled, which skipped the release step,
    # so state the ceiling explicitly instead of relying on the default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The runner image already carries the toolchain and the X11/ALSA headers
      # in the common case. apt is only reached when something is genuinely
      # missing: a runner whose apt sources are incomplete then cannot fail a
      # build that would otherwise have succeeded.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail

          missing=0
          for tool in cmake ninja pkg-config g++; do
            command -v "$tool" > /dev/null || missing=1
          done

          # The modules JUCE's Linux targets link against; checking them through
          # pkg-config catches a partial image, not just a missing toolchain.
          for module in alsa freetype2 fontconfig x11 xext xinerama xrandr \
                        xcursor xcomposite xrender xi gl; do
            pkg-config --exists "$module" || missing=1
          done

          if [ "$missing" -eq 0 ]; then
            echo "toolchain and headers already present, skipping apt"
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libegl-dev libcurl4-openssl-dev

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          # The cache holds generated CMake files with absolute paths, so the two
          # jobs must never share an entry.
          key: fetchcontent-${{ inputs.platform }}-juce-9.0.6-${{ hashFiles('cmake/Dependencies.cmake') }}

      # pluginval and clap-validator are pinned to a release each; the cache key
      # carries both versions so a bump re-downloads.
      - name: Cache validators
        uses: actions/cache@v4
        with:
          path: tools
          key: validators-v2-${{ inputs.platform }}-pluginval-1.0.4-clap-validator-0.4.1

      - name: Download validators
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGINVAL_ASSET: ${{ runner.os == 'Linux' && 'pluginval_Linux.zip' || 'pluginval_macOS.zip' }}
          CLAP_VALIDATOR_PATTERN: ${{ runner.os == 'Linux' && '*-ubuntu-22.04.zip' || '*-macos-universal.zip' }}
        run: |
          set -euo pipefail

          mkdir -p tools/bin

          if [ ! -x tools/bin/pluginval ]; then
            gh release download v1.0.4 --repo Tracktion/pluginval \
              --pattern "${PLUGINVAL_ASSET}" --dir tools --clobber
            unzip -o -q "tools/${PLUGINVAL_ASSET}" -d tools
            rm -f "tools/${PLUGINVAL_ASSET}"

            # Linux ships a bare binary, macOS a .app bundle whose resources must
            # stay next to it. A symlink hides the difference from the steps.
            ln -sf "$PWD/$(find tools -name pluginval -type f | head -n 1)" tools/bin/pluginval
          fi

          if [ ! -x tools/bin/clap-validator ]; then
            gh release download 0.4.1 --repo free-audio/clap-validator \
              --pattern "${CLAP_VALIDATOR_PATTERN}" --dir tools --clobber
            unzip -o -q tools/clap-validator-*.zip -d tools
            tar -xzf tools/clap-validator-*.tar.gz -C tools
            rm -f tools/clap-validator-*.zip tools/clap-validator-*.tar.gz

            # The tarball layout differs per platform (binaries/ on macOS).
            mv "$(find tools -name clap-validator -type f | head -n 1)" tools/bin/clap-validator
          fi

          chmod +x tools/bin/pluginval tools/bin/clap-validator
          tools/bin/pluginval --version
          tools/bin/clap-validator --version

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ inputs.extra_cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate VST3 (pluginval)
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          bundle="build/plugins/${PLUGIN}/${PLUGIN}_artefacts/Release/VST3/${PLUGIN}.vst3"
          # --skip-gui-tests keeps this headless: no display on the Linux runner.
          tools/bin/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process "$bundle"

      - name: Validate CLAP (clap-validator)
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          bundle="build/plugins/${PLUGIN}/${PLUGIN}_artefacts/Release/CLAP/${PLUGIN}.clap"

          # tee keeps the report in the log; with pipefail the validator's exit
          # code decides the step (it is non-zero when a test fails). Its summary
          # line is ANSI coloured, so it is not parsed.
          tools/bin/clap-validator validate "$bundle" | tee clap-validator.log

      - name: Validate AU
        if: runner.os == 'macOS'
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          set -x
          # cmake/WaivesPlugin.cmake writes the AU codes so they are defined in
          # one place only.
          read -r au_type au_code au_manufacturer < "build/au_code_${PLUGIN}.txt"

          component="$HOME/Library/Audio/Plug-Ins/Components/${PLUGIN}.component"
          mkdir -p "$(dirname "$component")"
          rm -rf "$component"
          cp -R "build/plugins/${PLUGIN}/${PLUGIN}_artefacts/Release/AU/${PLUGIN}.component" \
                "$(dirname "$component")/"

          # arm64 macOS refuses to load unsigned code, and the audio component
          # registry only picks the bundle up after it is restarted.
          codesign --force --deep -s - "$component"
          xattr -dr com.apple.quarantine "$component" || true
          killall -9 AudioComponentRegistrar || true
          sleep 3

          auval -a 2>&1 | grep -i "$au_code" || echo "component not listed by auval -a"

          for attempt in 1 2 3; do
            if auval -v "$au_type" "$au_code" "$au_manufacturer"; then
              exit 0
            fi
            echo "auval attempt $attempt failed, restarting the registrar"
            killall -9 AudioComponentRegistrar || true
            sleep 5
          done
          exit 1

      # upload-artifact resets file modes to 0644, which breaks the standalone
      # binary and the installer's -x check. A tarball keeps the permissions.
      - name: Package plugin bundles
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          mkdir -p dist
          # AGPLv3 requires the licence text to travel with the binaries, and
          # the MIT components require their notices.
          tar -czf "dist/${PLUGIN}-${{ inputs.platform }}.tar.gz" \
              -C "build/plugins/${PLUGIN}" "${PLUGIN}_artefacts/Release" \
              -C "$GITHUB_WORKSPACE" LICENSE THIRD-PARTY-NOTICES.md

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.plugin }}-${{ inputs.platform }}
          path: dist/${{ inputs.plugin }}-${{ inputs.platform }}.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
