name: build-plugin

# Reusable build of one plugin on one platform. Called by build.yml (pull
# requests) and release.yml (main), so the recipe exists once.

on:
  workflow_call:
    inputs:
      plugin:
        description: Directory name under plugins/
        type: string
        required: true
      platform:
        description: linux or macos
        type: string
        required: true
      os:
        description: Runner image
        type: string
        required: true
      extra_cmake_args:
        description: Extra arguments for the configure step
        type: string
        required: false
        default: ''
      retention_days:
        description: How long the artifact is kept
        type: number
        required: false
        default: 14

jobs:
  build:
    name: ${{ inputs.plugin }} / ${{ inputs.platform }}
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libegl-dev libcurl4-openssl-dev

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          # The cache holds generated CMake files with absolute paths, so the two
          # jobs must never share an entry.
          key: fetchcontent-${{ inputs.platform }}-juce-9.0.6-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ inputs.extra_cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate AU
        if: runner.os == 'macOS'
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          set -x
          # cmake/WaivesPlugin.cmake writes the AU codes so they are defined in
          # one place only.
          read -r au_type au_code au_manufacturer < "build/au_code_${PLUGIN}.txt"

          component="$HOME/Library/Audio/Plug-Ins/Components/${PLUGIN}.component"
          mkdir -p "$(dirname "$component")"
          rm -rf "$component"
          cp -R "build/plugins/${PLUGIN}/${PLUGIN}_artefacts/Release/AU/${PLUGIN}.component" \
                "$(dirname "$component")/"

          # arm64 macOS refuses to load unsigned code, and the audio component
          # registry only picks the bundle up after it is restarted.
          codesign --force --deep -s - "$component"
          xattr -dr com.apple.quarantine "$component" || true
          killall -9 AudioComponentRegistrar || true
          sleep 3

          auval -a 2>&1 | grep -i "$au_code" || echo "component not listed by auval -a"

          for attempt in 1 2 3; do
            if auval -v "$au_type" "$au_code" "$au_manufacturer"; then
              exit 0
            fi
            echo "auval attempt $attempt failed, restarting the registrar"
            killall -9 AudioComponentRegistrar || true
            sleep 5
          done
          exit 1

      # upload-artifact resets file modes to 0644, which breaks the standalone
      # binary and the installer's -x check. A tarball keeps the permissions.
      - name: Package plugin bundles
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          mkdir -p dist
          # AGPLv3 requires the licence text to travel with the binaries, and
          # the MIT components require their notices.
          tar -czf "dist/${PLUGIN}-${{ inputs.platform }}.tar.gz" \
              -C "build/plugins/${PLUGIN}" "${PLUGIN}_artefacts/Release" \
              -C "$GITHUB_WORKSPACE" LICENSE THIRD-PARTY-NOTICES.md

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.plugin }}-${{ inputs.platform }}
          path: dist/${{ inputs.plugin }}-${{ inputs.platform }}.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
